name: Publish to Docker Hub

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to publish (e.g., latest, 0.2.0, or v0.2.0)"
        required: true
        default: "latest"
      dry_run:
        description: "Dry run (build and verify without pushing to Docker Hub)"
        type: boolean
        default: false

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & Publish Container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web-ui/package-lock.json

      - name: Build Web UI
        run: |
          cd web-ui
          npm ci --no-audit --no-fund
          npm run build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Normalize Image Name & Tags
        id: meta
        run: |
          REPO_NAME="${{ secrets.DOCKERHUB_USERNAME }}"
          if [ -z "$REPO_NAME" ]; then
            REPO_NAME="${{ github.repository_owner }}"
          fi
          IMAGE="${REPO_NAME,,}/zhenyi"
          TAG="${{ inputs.image_tag }}"
          
          # Clean 'v' prefix if user typed v0.2.0
          CLEAN_TAG="${TAG#v}"
          
          TAGS="${IMAGE}:${TAG}"
          if [ "$TAG" != "latest" ]; then
            TAGS="${TAGS},${IMAGE}:latest,${IMAGE}:${CLEAN_TAG}"
          fi
          
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Multi-Arch Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ !inputs.dry_run }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sanitization Verification Audit
        run: |
          echo "Verifying local image context..."
          test ! -f .dockerignore || echo ".dockerignore is present"
          # Verify no secrets or databases were packaged
          if [ "${{ inputs.dry_run }}" = "false" ]; then
            echo "Successfully pushed multi-arch images: ${{ steps.meta.outputs.tags }}"
          else
            echo "Dry run completed successfully. Image was built without pushing."
          fi
