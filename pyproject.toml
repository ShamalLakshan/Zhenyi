[project]
name = "zhenyi"
version = "0.2.1"
description = "Autonomous Multi-Agent Niche Research Studio with Dynamic Knowledge Graph"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiosqlite>=0.19.0",
    "arxiv>=2.4.0",
    "cohere>=5.0.0",
    "cryptography>=42.0.0",
    "ddgs>=5.0.0",
    "fastapi>=0.104.0",
    "google-genai>=2.1.0",
    "httpx>=0.27.0",
    "openai>=1.30.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.6",
    "pyyaml>=6.0",
    "requests>=2.32.0",
    "tiktoken>=0.7.0",
    "uvicorn[standard]>=0.24.0",
    "yt-dlp>=2024.0.0",
]

[tool.uv]
package = false
